name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate release version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' lakefile.toml)"
          test -n "$package_version"
          test "$REQUESTED_TAG" = "v$package_version"
          git rev-parse --verify "refs/tags/$REQUESTED_TAG"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "ProbabilityApproximation $TAG" \
              --generate-notes \
              --latest
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Lean and restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Build release library as a dependency
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/probability-release-consumer"
          mkdir -p "$consumer_dir"
          cp lean-toolchain "$consumer_dir/lean-toolchain"
          {
            echo 'name = "ProbabilityApproximationReleaseConsumer"'
            echo 'version = "0.0.0"'
            echo
            echo '[[require]]'
            echo 'name = "ProbabilityApproximation"'
            printf 'path = "%s"\n' "$GITHUB_WORKSPACE"
          } > "$consumer_dir/lakefile.toml"
          lake -d="$consumer_dir" update
          lake -d="$consumer_dir" exe cache get
          lake --wfail --no-cache -d="$consumer_dir" build ProbabilityApproximation

      - name: Audit release
        run: |
          ./.github/scripts/forbidden_tokens.sh
          ./.github/scripts/audit_axioms.sh

      - name: Upload Lake release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          lake upload "$TAG"
